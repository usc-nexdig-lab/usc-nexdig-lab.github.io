name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write only the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No npm install: build.mjs uses only Node built-ins, and ubuntu-latest
      # ships Node 20+. On a pull request this is purely a validation gate --
      # malformed content fails here, naming the file, before reaching main.
      - name: Check the CMS schema matches the content
        run: python3 -m pip install --quiet pyyaml && python3 tools/check-cms.py

      - name: Check templates survive incomplete CMS drafts
        run: node tools/check-previews.mjs

      - name: Build site
        run: node build.mjs

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
